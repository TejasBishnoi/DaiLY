<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111312">
  <title>DaiLY · local chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail">
      <a class="brand" href="#" aria-label="DaiLY home"><span class="brand-mark">D</span></a>
      <button class="rail-button active" id="newChatButton" aria-label="New chat" title="New chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-button" id="settingsButton" aria-label="Connection settings" title="Connection settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 2.94-.08-.02a1.7 1.7 0 0 0-1.79.82l-.04.08h-3.4l-.03-.08a1.7 1.7 0 0 0-1.78-.82l-.08.02-1.7-2.94.06-.06A1.7 1.7 0 0 0 9.6 15l-.08-.04v-3.4l.08-.03a1.7 1.7 0 0 0 .82-1.78l-.02-.08 2.94-1.7.06.06a1.7 1.7 0 0 0 1.88.34l.04-.08h3.4l.03.08a1.7 1.7 0 0 0 1.78.82l.08-.02 1.7 2.94-.06.06a1.7 1.7 0 0 0-.34 1.88z" transform="translate(-2 -2) scale(.92)"/></svg>
      </button>
      <div class="avatar">Y</div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="workspace-name"><span class="workspace-icon">✳</span> DaiLY <span class="crumb">/</span> <span class="dim">new chat</span></div>
        <div class="topbar-right"><span class="server-pill"><span class="status-dot" id="statusDot"></span><span id="statusText">checking server</span></span><button class="icon-button" id="headerSettings" aria-label="Connection settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 2.94-.08-.02a1.7 1.7 0 0 0-1.79.82l-.04.08h-3.4l-.03-.08a1.7 1.7 0 0 0-1.78-.82l-.08.02-1.7-2.94.06-.06A1.7 1.7 0 0 0 9.6 15l-.08-.04v-3.4l.08-.03a1.7 1.7 0 0 0 .82-1.78l-.02-.08 2.94-1.7.06.06a1.7 1.7 0 0 0 1.88.34l.04-.08h3.4l.03.08a1.7 1.7 0 0 0 1.78.82l.08-.02 1.7 2.94-.06.06a1.7 1.7 0 0 0-.34 1.88z" transform="translate(-2 -2) scale(.92)"/></svg></button></div>
      </header>

      <section class="conversation" id="conversation" aria-live="polite">
        <div class="welcome" id="welcome">
          <h1>DaiLY</h1>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-wrap">
        <div class="drop-overlay" id="dropOverlay">Drop an image to add it</div>
        <div class="attachment-preview" id="attachmentPreview" hidden></div>
        <form class="composer" id="chatForm">
          <textarea id="messageInput" rows="1" placeholder="Ask anything..." aria-label="Message"></textarea>
          <div class="composer-bottom">
            <div class="composer-tools">
              <button type="button" class="tool-button" id="uploadButton" aria-label="Add an image" title="Add an image"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m20 15-5-5L5 20"/></svg><span>Add image</span></button>
              <input type="file" id="imageInput" accept="image/*" hidden>
            </div>
            <div class="send-side"><span class="key-hint">↵ to send</span><button class="send-button" id="sendButton" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24"><path d="M12 19V5m-7 7 7-7 7 7"/></svg></button></div>
          </div>
        </form>
        <p class="disclaimer">Your conversations stay on this device, with a little help from the web.</p>
      </div>
    </main>
  </div>

  <dialog id="settingsDialog" class="settings-dialog">
    <form method="dialog" class="settings-card">
      <div class="dialog-heading"><div><p class="eyebrow">YOUR LOCAL MODEL</p><h2>Connection settings</h2></div><button class="icon-button close-button" aria-label="Close settings">×</button></div>
      <label class="field-label" for="serverUrl">llama.cpp server URL</label>
      <input class="text-field" id="serverUrl" type="url" value="http://localhost:8080" placeholder="http://localhost:8080">
      <p class="field-note">The address where <code>llama-server</code> is running.</p>
      <div class="connection-state"><span class="status-dot" id="dialogStatusDot"></span><span id="dialogStatusText">Not connected</span><button type="button" class="text-action" id="checkConnection">Check connection</button></div>
      <div class="dialog-actions"><button class="secondary-button" value="cancel">Cancel</button><button class="primary-button" id="saveSettings" value="save">Save settings <span>↗</span></button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
